name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-dev.txt
          .venv/Scripts/python.exe -m playwright install chromium
      - name: Test the application
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe tests/ui_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe tests/lyrics_ui.py
      - name: Build portable executable
        shell: pwsh
        run: ./build.ps1
      - name: Test the packaged executable
        shell: pwsh
        run: |
          .venv/Scripts/python.exe tools/verify_frozen.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe tests/ui_smoke.py --exe dist/MemuMusic.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe tests/lyrics_ui.py dist/MemuMusic.exe
      - name: Build and test Windows installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe") -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./build-installer.ps1 -TestBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m unittest discover -s tests -p test_installer.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-installer.ps1
      - name: Include dependency source
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pip download --no-deps --no-binary=mutagen,pykakasi,korean-romanizer --dest dist/third-party-source mutagen==1.48.1 pykakasi==2.3.0 korean-romanizer==0.25.0
      - uses: actions/upload-artifact@v4
        with:
          name: MemuMusic-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MemuMusic-Windows
          path: dist
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v1.0.0-preview.2"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "$tag" ]]; then
            echo "Unexpected release tag" >&2; exit 1
          fi
          gh release create "$tag" dist/MemuMusic-Setup.exe dist/MemuMusic-Setup.exe.sha256 \
            dist/MemuMusic.exe dist/MemuMusic.exe.sha256 dist/third-party-source/* \
            --target "$GITHUB_SHA" --title "MemuMusic 1.0.0 — Preview 2" --prerelease --notes-file release-notes.md
